# ============================================================
# BuildSmart ΓÇö Database Connection Properties
# ============================================================
# Edit this file to match your local MySQL setup.
# This file is loaded at runtime by DBConnection.java via
# getClass().getClassLoader().getResourceAsStream("db.properties")
# It must live in: src/main/resources/db.properties
# ============================================================

# --- Connection ---
db.host=localhost
db.port=3306
db.name=buildsmart
db.url=jdbc:mysql://localhost:3306/buildsmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo&characterEncoding=UTF-8

# --- Credentials ---
# Default XAMPP/WAMP root has an empty password ΓÇö update if yours differs
db.username=root
db.password=

# --- Connection Pool Settings ---
db.pool.initialSize=5
db.pool.maxSize=20
db.pool.maxIdle=10
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000

# --- Driver (MySQL Connector/J 8.x) ---
db.driver=com.mysql.cj.jdbc.Driver
